exploration_coordinator:
  ros__parameters:
    stability_duration: 10.0
    stability_threshold: 0.02
    min_frontier_size: 5
    exploration_strategy: "frontier"  # frontier or graph
    frontier_planning_attempts: 12
    frontier_goal_search_radius: 1.2
    frontier_goal_clearance: 0.20
    frontier_goal_standoff: 0.45
    frontier_goal_map_edge_clearance: 0.0
    frontier_goal_min_advance: 0.35
    frontier_goal_point_sample_limit: 40
    nav2_goal_reach_radius: 0.25  # Keep in sync with Nav2 xy_goal_tolerance.
    failed_goal_cooldown: 20.0
    failed_goal_radius: 0.6
    frontier_retry_interval: 3.0
    nav2_request_timeout: 5.0
    initial_spin_yaw: 6.283185307
    initial_spin_timeout: 30.0
    nav2_goal_timeout: 30.0
    graph_max_frontier_candidates: 8
    graph_info_radius: 1.5
    graph_node_spacing: 0.5
    graph_yaw_spacing: 0.35
    graph_hallucinated_node_spacing: 0.75
    graph_loop_closure_radius: 2.0
    graph_loop_closure_min_separation: 20
    graph_loop_closure_occupied_threshold: 0.03
    graph_loop_closure_weight: 1.5
    graph_max_loop_closures_per_node: 3
    graph_path_cost_weight: 0.05
    graph_frontier_weight: 0.001
    graph_odom_cov_x: 0.04
    graph_odom_cov_y: 0.04
    graph_odom_cov_yaw: 0.008
